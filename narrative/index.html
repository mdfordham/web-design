<!DOCTYPE html>
<html lang="en">
<head>
    <title>Widow's Bay</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">
</head>
<body>
    <section class="hero">
        <h1>Widow's Bay</h1>

     <nav class="hero-menu" aria-label="Main navigation">
    <input class="menu-toggle" type="checkbox" id="menu-toggle" aria-label="Toggle menu">

    <label class="menu-button" for="menu-toggle">
                <span></span>
                <span></span>
                <span></span>
</label>

    <div class="menu-overlay">
                <label class="menu-backdrop" for="menu-toggle" aria-label="Close menu"></label>
                <div class="menu-panel">
                    <a href="page2.html">Upcoming Events</a>
                    <a href="page3.html">Town History</a>
                    <a href="page4.html">Plan Your Visit</a>
                </div>
            </div>
        </nav>
        <a class="scroll-cue" href="#scenic-gallery">
            <span>Scroll to explore</span>
            <span class="scroll-cue-arrow" aria-hidden="true"></span>
        </a>
    </section>

    <section id="scenic-gallery">
        <img src="scenic2.jpg" alt="Widow's Bay scenic view">
    </section>

    <section id="section-3">
        <img src="scenic4.jpg" alt="Widow's Bay scenic view">
    </section>

    <section>
        <img src="scenic6.jpg" alt="Widow's Bay scenic view">
    </section>

    <section>
        <img src="scenic5.jpg" alt="Widow's Bay scenic view">
    </section>

    <div class="patricia-popup" id="patricia-popup" role="dialog" aria-labelledby="patricia-message" hidden>
        <button class="popup-close" type="button" aria-label="Close popup">&times;</button>
        <p id="patricia-message">Thank you to Patricia, our assistant to the mayor, for making our website!</p>
        <img class="patricia-headshot" src="Patricia headshot.jpg" alt="Patricia">
    </div>

    <script>
        const patriciaPopup = document.getElementById("patricia-popup");

        patriciaPopup.querySelector(".popup-close").addEventListener("click", () => {
            patriciaPopup.hidden = true;
        });

        const section3 = document.getElementById("section-3");
        const observer = new IntersectionObserver(([entry]) => {
            if (entry.isIntersecting) {
                patriciaPopup.hidden = false;
                observer.disconnect();
            }
        }, { threshold: 0.25 });

        observer.observe(section3);
    </script>

</body>
</html>
