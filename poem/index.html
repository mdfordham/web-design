<!DOCTYPE html>
<html>
<head>
     <!-- This title is a comment-->
     <!-- This title appears in the tab-->
     <title>Poem Practice</title>
     <!-- Connect the css to this index file using the link tag-->
      <link rel="stylesheet" href="style.css">
    <!-- google fonts-->
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&family=Monoton&display=swap" rel="stylesheet">
</head>
<body>
    <!-- the body contains all the content-->
    <h1 class="cabin-sketch-bold">The bottoms of my <span class="highlight-word">shoes</span> </h1>
    <h2 class="monoton-regular"> Jack Kerouac</h2>
    <img src="images/walking01.jpg"
    alt="repeating shoes walking"
    walking
    class="fadetop">
    <p>The bottoms of my shoes</p>
    <img src="images/walking02.jpg"
    alt="repeating shoes walking"
    class="fademiddle">
    <p class="indent">are clean</p>
    <img src="images/walking03.jpg"
    alt="repeating shoes walking"
    class="fadelast">
    <p class="indent-more monoton-regular">From walking in the rain</p>
    <img src="images/walking04.jpg"
    alt="repeating shoes walking">
    <h6>Photo by Eadweard Muybridge, 1887</h6>
</body>
</html>
